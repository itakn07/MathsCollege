<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathsCollege - Exercices</title>

 <!-- Favicon (icône dans l'onglet du navigateur) -->
    <link rel="icon" type="image/png" href="logo.png">


    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- En-tête -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between">
        <a href="index.html" class="text-xl font-bold text-slate-900">MathsCollege</a>
        <a href="index.html" class="text-xs font-semibold text-slate-500 hover:text-slate-800">← Retour à l'accueil</a>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-8">
        
        <!-- VUE LISTE DES EXERCICES -->
        <div id="vue-liste-exercices">
            <div class="mb-6 flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900">Exercices pratiques</h1>
                    <p class="text-sm text-slate-500">Entraîne-toi sur le programme de 6ème</p>
                </div>

                <!-- Onglets Algèbre / Géométrie -->
                <div class="inline-flex p-1 bg-slate-200/60 rounded-xl text-xs font-semibold">
                    <button id="btn-algebre-exo" onclick="changerDomaineExo('algebre')" class="btn-domaine-exo px-4 py-2 rounded-lg transition bg-white text-slate-900 shadow-sm">
                        Algèbre
                    </button>
                    <button id="btn-geometrie-exo" onclick="changerDomaineExo('geometrie')" class="btn-domaine-exo px-4 py-2 rounded-lg transition text-slate-600 hover:text-slate-900">
                        Géométrie
                    </button>
                </div>
            </div>

            <!-- Grille des exercices -->
            <div id="liste-exercices" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Les exercices seront injectés ici -->
            </div>
        </div>

        <!-- VUE DÉTAIL D'UN EXERCICE -->
        <div id="vue-detail-exercice" class="hidden">
            <button onclick="retournerAuxExercices()" class="mb-4 text-xs font-semibold text-slate-500 hover:text-slate-900 flex items-center gap-1">
                ← Retour à la liste des exercices
            </button>
            <div id="contenu-exercice">
                <!-- Le détail de l'exercice sera injecté ici -->
            </div>
        </div>

    </main>

    <script src="exercices.js"></script>
</body>
</html>
