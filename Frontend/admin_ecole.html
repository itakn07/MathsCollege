<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MathsCollege - Espace Admin École</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-6">

  <div class="max-w-6xl mx-auto space-y-8">
    
    <!-- En-tête -->
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Espace Administrateur - Collège</h1>
        <p class="text-sm text-slate-500">Gestion des classes, des élèves et des professeurs de mathématiques.</p>
      </div>
      <button id="btn-open-add-teacher" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow-sm transition">
        + Ajouter un Professeur
      </button>
    </div>

    <!-- 1. Chiffres Clés -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs uppercase font-bold text-slate-400">Total Élèves</p>
        <p id="stat-total-students" class="text-3xl font-extrabold text-indigo-600 mt-1">0</p>
      </div>
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs uppercase font-bold text-slate-400">Profs de Maths</p>
        <p id="stat-total-teachers" class="text-3xl font-extrabold text-indigo-600 mt-1">0</p>
      </div>
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs uppercase font-bold text-slate-400">Classes Actives</p>
        <p id="stat-total-classes" class="text-3xl font-extrabold text-indigo-600 mt-1">0</p>
      </div>
    </div>

    <!-- 2. Liste des Classes -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
      <h2 class="text-lg font-bold text-slate-900 mb-4">Classes et Effectifs</h2>
      <div id="classes-list" class="divide-y divide-slate-100">
        <!-- Rempli dynamiquement par JS -->
      </div>
    </div>

    <!-- 3. Liste des Professeurs -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
      <h2 class="text-lg font-bold text-slate-900 mb-4">Professeurs de Mathématiques</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
            <tr>
              <th class="py-2 px-3">Nom & Prénom</th>
              <th class="py-2 px-3">Email</th>
              <th class="py-2 px-3">Classes</th>
              <th class="py-2 px-3 text-right">Action</th>
            </tr>
          </thead>
          <tbody id="teachers-table-body" class="divide-y divide-slate-100">
            <!-- Rempli dynamiquement par JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- MODALE : Liste des Élèves -->
  <div id="modal-students" class="fixed inset-0 bg-slate-900/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-lg max-w-lg w-full p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="modal-class-title" class="text-lg font-bold text-slate-900">Élèves de la classe</h3>
        <button id="btn-close-students-modal" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
      </div>
      <ul id="modal-students-list" class="divide-y divide-slate-100 max-h-60 overflow-y-auto text-sm">
        <!-- Rempli par JS -->
      </ul>
    </div>
  </div>

  <!-- MODALE : Ajouter un Professeur -->
  <div id="modal-add-teacher" class="fixed inset-0 bg-slate-900/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-lg max-w-md w-full p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-lg font-bold text-slate-900">Ajouter un Professeur de Maths</h3>
        <button id="btn-close-teacher-modal" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
      </div>
      <form id="form-add-teacher" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nom complet</label>
          <input type="text" id="teacher-name" required class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-600">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Adresse Email</label>
          <input type="email" id="teacher-email" required class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-600">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Classe(s) à attribuer</label>
          <select id="teacher-classes" multiple class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-600 min-h-[100px]">
            <!-- Rempli dynamiquement par JS -->
          </select>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="btn-cancel-teacher" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-100 rounded-lg">Annuler</button>
          <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script src="admin_ecole.js"></script>
</body>
</html>
